version: '3.9'

# 自助终端 kioskweb：由 kioskweb-build 使用 ../kioskweb/Dockerfile 构建并写入卷 kioskweb_static，
# nixizhiyuan-nginx 挂载该卷（nginx.conf listen 8080）。无需单独 cd kioskweb 执行 npm run build。
# 更新前端后：docker compose build kioskweb-build && docker compose up -d

services:
  # 自助终端前端：构建镜像并把 /app/dist 拷入命名卷后退出（一次性任务）
  kioskweb-build:
    build:
      context: ../kioskweb
      dockerfile: Dockerfile
    image: kioskweb:latest
    container_name: kioskweb-build
    restart: 'no'
    volumes:
      - kioskweb_static:/mnt
    command:
      [
        'sh',
        '-c',
        'rm -rf /mnt/* && cp -r /app/dist/. /mnt/',
      ]

  # NestJS 应用服务
  nixizhiyuan-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nixizhiyuan-server
    restart: always
    # 不暴露端口，仅通过 nginx 访问
    # ports:
    #   - '3002:3002'
    environment:
      - NODE_ENV=production
      - APP_PORT=3002
      # 使用已存在的 PostgreSQL 容器名称（与服务名 db 对应）
      - DB_HOST=rbridge-db
      - DB_PORT=5432
      # NestJS 应用使用的环境变量名称（从主应用的环境变量读取）
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=${POSTGRES_DB}
      # 使用已存在的 Redis 容器名称（与服务名 redis 对应）
      - REDIS_HOST=rbridge-redis
      - REDIS_PORT=6379
      # Redis 密码（从主应用的环境变量读取）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT 密钥（从主应用的环境变量读取）
      - JWT_SECRET=${JWT_SECRET}
      # 微信小程序配置（从主应用的环境变量读取）
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - CURRENT_YEAR=${CURRENT_YEAR}
      - SECRET_KEY=${SECRET_KEY}
      - OFFSET=${OFFSET}
      - WX_PAY_MCHID=${WX_PAY_MCHID}
      - WX_PAY_NOTIFY_URL=${WX_PAY_NOTIFY_URL}
      - WX_PAY_V3_KEY=${WX_PAY_V3_KEY}
      - WX_PAY_CERT_DIR=${WX_PAY_CERT_DIR}
      - WX_PAY_PUB_KEY_ID=${WX_PAY_PUB_KEY_ID}
    networks:
      # 连接到已存在的外部网络（主应用的 app-network）
      - rbridge_app-network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  # Nginx 反向代理服务
  nixizhiyuan-nginx:
    image: nginx:alpine
    container_name: nixizhiyuan-nginx
    restart: always
    ports:
      # 80 端口已被其他应用使用，仅使用 HTTPS
      # - '80:80'
      - '443:443'
      # 宿主机 8000 常被 nixi-app 等占用，改用 8443 映射到容器内 listen 8000 ssl
      # 访问：https://域名:8443/...（容器内仍为 8000，无需改 nginx.conf）
      - '8443:8000'
      # 自助终端前端（nginx.conf 内 listen 8080，避免与 80 冲突）
      - '8080:8080'
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书文件
      - ./https-key:/etc/nginx/ssl:ro
      # Nginx 日志
      - ./logs/nginx:/var/log/nginx
      # 自助终端静态资源（由 kioskweb-build 填充）
      - kioskweb_static:/usr/share/nginx/kioskweb:ro
    depends_on:
      nixizhiyuan-server:
        condition: service_started
      kioskweb-build:
        condition: service_completed_successfully
    networks:
      - rbridge_app-network

networks:
  # 使用已存在的外部网络（主应用的 app-network）
  rbridge_app-network:
    external: true

volumes:
  kioskweb_static:
